<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học Y tế — Lộ trình học</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#58cc02">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#58cc02; --green-d:#4aa802; --green-l:#d7ffb8; --green-t:#58a700;
  --blue:#1cb0f6; --blue-d:#1899d6; --blue-l:#ddf4ff;
  --purple:#ce82ff; --purple-d:#a568cc;
  --red:#ff4b4b; --red-d:#e63f3f; --red-l:#ffdfe0; --red-t:#ea2b2b;
  --yellow:#ffc800; --yellow-d:#e5a600;
  --ink:#3c3c3c; --ink-2:#777; --ink-3:#afafaf;
  --line:#e5e5e5; --line-2:#d4d4d4; --bg:#fff; --panel:#fafafa;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Nunito,ui-rounded,"Segoe UI",system-ui,sans-serif;
  color:var(--ink); background:var(--bg); font-weight:700;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-weight:800;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:40;background:#fff;border-bottom:2px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:10px 20px;
}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.2px}
.brand .mark{
  width:30px;height:30px;border-radius:8px;background:var(--green);
  display:grid;place-items:center;color:#fff;font-size:15px;font-weight:900
}
.brand small{display:block;font-size:11px;color:var(--ink-3);font-weight:700}
.stats{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:15px}
.stat{display:flex;align-items:center;gap:6px}
.stat svg{width:22px;height:22px;flex:none}
.stat.fire{color:#ff9600}.stat.gem{color:var(--blue)}.stat.heart{color:var(--red)}
.stat .inf{font-size:19px;line-height:1}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr) 400px;gap:0;align-items:start}
.col{min-height:calc(100vh - 54px)}
.path{
  border-right:2px solid var(--line);padding:22px 16px 60px;background:#fff;
  position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto;overscroll-behavior:contain
}
.path::-webkit-scrollbar,.practice::-webkit-scrollbar{width:8px}
.path::-webkit-scrollbar-thumb,.practice::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.path::-webkit-scrollbar-thumb:hover,.practice::-webkit-scrollbar-thumb:hover{background:var(--line-2)}
.lesson{padding:24px 34px 80px;min-width:0}
.practice{border-left:2px solid var(--line);padding:20px 20px 40px;background:#fff;position:sticky;top:54px;max-height:calc(100vh - 54px);overflow:auto}

/* ---------- path ---------- */
.unit{
  border-radius:14px;color:#fff;padding:12px 16px;margin:26px 0 10px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  box-shadow:0 4px 0 rgba(0,0,0,.18)
}
.unit:first-child,.pathhead + .unit{margin-top:0}
.unit b{display:block;font-size:12px;letter-spacing:1.4px;opacity:.85}
.unit span{font-size:15px;font-weight:900;line-height:1.25}
.unit.blue{background:var(--blue)}.unit.purple{background:var(--purple)}.unit.green{background:var(--green)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 4px}
.noderow{display:flex;justify-content:center;width:100%}
.noderow.l{transform:translateX(-58px)}
.noderow.r{transform:translateX(58px)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;border-radius:12px}
.bubble{
  width:66px;height:66px;border-radius:50%;display:grid;place-items:center;
  background:var(--line-2);box-shadow:0 6px 0 #b8b8b8;transition:transform .08s;
  border:0
}
.node:hover .bubble{transform:translateY(-2px)}
.node:active .bubble{transform:translateY(5px);box-shadow:0 1px 0 #b8b8b8}
.bubble svg{width:32px;height:32px;color:#fff}
.node.on .bubble{background:var(--blue);box-shadow:0 6px 0 var(--blue-d)}
.node.done .bubble{background:var(--green);box-shadow:0 6px 0 var(--green-t)}
.node.active .bubble{outline:4px solid #fff;box-shadow:0 0 0 4px var(--blue),0 6px 0 var(--blue-d)}
.node.done.active .bubble{box-shadow:0 0 0 4px var(--green),0 6px 0 var(--green-t)}
.node small{font-size:11px;color:var(--ink-2);font-weight:800}
.crown{
  position:absolute;right:2px;bottom:22px;width:20px;height:20px;border-radius:50%;
  background:var(--yellow);display:grid;place-items:center;border:2px solid #fff;font-size:10px;color:#7a5b00
}
.startpill{
  position:absolute;top:-26px;background:#fff;border:2px solid var(--line);border-bottom-width:3px;
  border-radius:10px;padding:2px 9px;font-size:10px;letter-spacing:1px;color:var(--green-t);white-space:nowrap
}

/* ---------- lesson centre ---------- */
.lhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:22px}
.lhead .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.lhead h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.4px}
.lhead p{margin:2px 0 0;color:var(--ink-3);font-size:14px}
.card{border:2px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:20px;background:#fff}
.card > h2{margin:0 0 4px;font-size:19px;font-weight:900}
.card > .sub{margin:0 0 16px;color:var(--ink-3);font-size:13px}
.secno{
  display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;
  background:var(--green);color:#fff;font-size:13px;margin-right:8px;vertical-align:2px
}
.vocab{display:grid;gap:8px}
.vrow{display:grid;grid-template-columns:minmax(140px,1.1fr) minmax(120px,1fr);gap:14px;
  border:2px solid var(--line);border-radius:12px;padding:11px 14px;align-items:baseline}
.vrow:hover{background:var(--panel)}
.vrow .en{font-size:15px;font-weight:800}
.vrow .vi{font-size:15px;color:var(--blue-d);font-weight:800}
.vrow .note{grid-column:1/-1;font-size:13px;color:var(--ink-2);font-weight:600;line-height:1.5;margin-top:2px}
.blocks{display:grid;gap:18px}
.block h3{margin:0 0 8px;font-size:15px;font-weight:900;color:var(--green-t)}
.block ul{margin:0;padding-left:20px;display:grid;gap:9px}
.block li{font-size:15px;font-weight:600;line-height:1.62;color:#4b4b4b}
.block li b{font-weight:900;color:var(--ink)}
.done-btn{margin-top:18px}

.btn{
  border-radius:14px;padding:12px 22px;font-size:14px;letter-spacing:.6px;color:#fff;
  background:var(--green);box-shadow:0 4px 0 var(--green-t);transition:transform .06s
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-t)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.blue:active{box-shadow:0 1px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink-3);border:2px solid var(--line);border-bottom-width:4px;box-shadow:none}
.btn[disabled]{background:var(--line);color:var(--ink-3);box-shadow:none;cursor:default;transform:none}
.btn.wide{width:100%}
.tick{display:inline-flex;align-items:center;gap:8px;color:var(--green-t);font-size:14px;margin-top:18px}

/* ---------- practice ---------- */
.pbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.px{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);font-size:20px;flex:none}
.px:hover{background:var(--panel)}
.track{flex:1;height:15px;border-radius:10px;background:var(--line)}
.fill{height:100%;border-radius:10px;background:var(--green);transition:width .3s;position:relative}
.fill::after{content:"";position:absolute;inset:3px 6px auto 6px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.qtag{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:1.2px;color:var(--purple-d);margin-bottom:12px}
.qtag .dot{width:16px;height:16px;border-radius:50%;background:var(--purple);display:grid;place-items:center;color:#fff;font-size:10px}
.qtitle{font-size:21px;font-weight:900;margin:0 0 20px;line-height:1.35}
.opt{
  display:block;width:100%;text-align:left;border:2px solid var(--line);border-bottom-width:4px;
  border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:10px;background:#fff;font-weight:700
}
.opt:hover{background:var(--panel)}
.opt.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.opt.right{border-color:var(--green);background:var(--green-l);color:var(--green-t)}
.opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-t)}
.opt .k{display:inline-grid;place-items:center;width:22px;height:22px;border:2px solid var(--line);
  border-radius:6px;font-size:11px;margin-right:10px;color:var(--ink-3)}
.opt.sel .k{border-color:var(--blue);color:var(--blue-d)}

.sent{font-size:19px;font-weight:800;line-height:2.1}
.sent input{
  font-family:inherit;font-weight:800;font-size:17px;color:var(--ink);
  border:none;border-bottom:2px solid var(--line-2);background:transparent;
  width:150px;padding:2px 4px;text-align:center
}
.sent input:focus{outline:none;border-bottom-color:var(--blue)}

.answer-line{min-height:56px;border-bottom:2px solid var(--line);margin-bottom:6px;
  display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:6px 0}
.answer-line.second{min-height:44px;margin-bottom:22px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{
  border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;
  padding:8px 13px;font-size:15px;background:#fff;font-weight:700
}
.tile:hover{background:var(--panel)}
.tile.ghosted{color:transparent;background:var(--line);border-color:var(--line);pointer-events:none}
.hintbar{font-size:13px;font-weight:700;color:var(--ink-3);margin:14px 0 0}
.hintbar b{color:var(--blue-d)}

.feedback{border-radius:16px;padding:14px 16px;margin-top:20px;display:none}
.feedback.show{display:block;animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.feedback.ok{background:var(--green-l);color:var(--green-t)}
.feedback.no{background:var(--red-l);color:var(--red-t)}
.feedback h4{margin:0 0 4px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.feedback p{margin:0;font-size:14px;font-weight:700;line-height:1.5}
.pfoot{margin-top:20px;display:flex;gap:10px}
.pfoot .btn{flex:1}
.finish{text-align:center;padding:30px 10px}
.finish .big{font-size:26px;font-weight:900;margin:14px 0 6px}
.finish p{color:var(--ink-2);font-weight:700;font-size:14px;margin:0 0 22px}
.scorebox{display:flex;gap:12px;justify-content:center;margin-bottom:24px}
.sb{flex:1;border:2px solid var(--yellow);border-radius:14px;overflow:hidden;max-width:150px}
.sb .h{background:var(--yellow);color:#fff;font-size:11px;letter-spacing:1px;padding:3px}
.sb .v{padding:9px;font-size:19px;color:var(--yellow-d)}
.sb.b{border-color:var(--green)}.sb.b .h{background:var(--green)}.sb.b .v{color:var(--green-t)}


html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.node,.tile,.opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@supports (height:100dvh){
  .col{min-height:calc(100dvh - 54px)}
  .path{height:calc(100dvh - 54px)}
  .practice{max-height:calc(100dvh - 54px)}
}
.tabs{padding-bottom:env(safe-area-inset-bottom)}
@media (max-width:820px){ .wrap{padding-bottom:calc(64px + env(safe-area-inset-bottom))} .col{min-height:0} .path{height:auto} .practice{max-height:none} }

/* ---------- subject switcher ---------- */
.subjs{display:flex;gap:8px;margin-left:18px;flex-wrap:nowrap}
.subj{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-bottom-width:4px;
  border-radius:14px;padding:4px 10px;font-size:13px;color:var(--ink-2);background:#fff;white-space:nowrap}
.subj:hover{background:var(--panel)}
.subj .sb-dot{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:900}
.subj.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.subj .full{display:inline}.subj .short{display:none}
.subj small{font-size:11px;color:var(--ink-3);font-weight:800}
.subj.on small{color:var(--blue-d)}
.pathhead{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:10px 12px;border:2px solid var(--line);border-radius:14px}
.pathhead .sb-dot{width:40px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:900;flex:none}
.pathhead b{display:block;font-size:14px;font-weight:900;line-height:1.25}
.pathhead span{font-size:12px;color:var(--ink-3)}
.vrow .vi{font-size:13px;color:var(--blue-d);font-weight:800;text-align:right}
@media (max-width:1250px){ .subj .full{display:none} .subj .short{display:inline} .subj small{display:none} }
@media (max-width:820px){
  .top{flex-wrap:wrap}
  .subjs{order:3;width:100%;margin-left:0;justify-content:space-between}
  .subj{flex:1;justify-content:center;padding:5px 6px}
  .path,.practice{top:0}
}


/* ---------- practice modes ---------- */
.qtitle .gap{color:var(--blue-d);letter-spacing:2px}
.pmodes{display:flex;gap:6px;margin:0 0 18px;padding:4px;border:2px solid var(--line);border-radius:16px;background:var(--panel)}
.pmodes button{flex:1;border-radius:12px;padding:9px 6px;font-size:12.5px;font-weight:900;color:var(--ink-3);letter-spacing:.3px;line-height:1.2}
.pmodes button.on{background:#fff;color:var(--blue-d);box-shadow:0 2px 0 var(--line)}
.deckpick{display:flex;gap:8px;margin-bottom:14px}
.deckpick button{flex:1;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:9px;font-size:13px;font-weight:900;color:var(--ink-2);background:#fff}
.deckpick button.on{border-color:var(--purple);background:#f6ecff;color:var(--purple-d)}
.fcmeta{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink-3);margin:0 2px 8px;letter-spacing:.4px}
.fcwrap{perspective:1200px;margin-bottom:16px}
.fcard{position:relative;width:100%;min-height:290px;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;background:#fff;overflow:auto}
.fface.front{align-items:center;justify-content:center;text-align:center}
.fface.back{transform:rotateY(180deg);background:#f7fbff;border-color:#cfe9fb}
.fface .kind{position:absolute;top:12px;left:14px;font-size:11px;font-weight:900;letter-spacing:1px;color:var(--ink-3)}
.fface .term{font-size:24px;font-weight:900;line-height:1.3}
.fface .alt{margin-top:8px;font-size:14px;font-weight:800;color:var(--blue-d)}
.fface .tap{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:var(--ink-3)}
.fface .bk-h{font-size:15px;font-weight:900;color:var(--blue-d);margin:14px 0 8px}
.fface .bk-t{font-size:16px;font-weight:700;line-height:1.55;color:var(--ink)}
.fface ul{margin:0;padding-left:18px}
.fface li{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:6px;color:var(--ink-2)}
.fcbtns{display:flex;gap:10px}
.fcbtns .btn{flex:1}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.fctools{display:flex;justify-content:center;gap:18px;margin-top:14px}
.fctools button{font-size:13px;font-weight:900;color:var(--blue-d);letter-spacing:.3px}
@media (max-width:820px){ .fcard{min-height:230px} .pmodes{margin-bottom:12px} }
.smc-src{margin-top:10px;font-size:13px;font-weight:600;line-height:1.5;color:var(--ink-2)}

/* ---------- mobile ---------- */
.tabs{display:none}
@media (max-width:1100px){
  .wrap{grid-template-columns:250px minmax(0,1fr)}
  .practice{grid-column:1/-1;border-left:none;border-top:2px solid var(--line);position:static;max-height:none;max-width:640px}
}
@media (max-width:820px){
  .wrap{display:block;padding-bottom:64px}
  .col{min-height:0}
  .path,.lesson,.practice{display:none;border:none}
  .col.shown{display:block}
  .lesson{padding:20px 16px 40px}
  .path{border-right:none;position:static;height:auto;overflow:visible}
  .tabs{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;
    border-top:2px solid var(--line)
  }
  .tabs button{flex:1;padding:10px 4px 8px;display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--ink-3)}
  .tabs button svg{width:24px;height:24px}
  .tabs button.on{color:var(--blue)}
  .top{padding:8px 12px;gap:10px}
  .stats{gap:12px;font-size:14px}
  .brand small{display:none}
}
</style>

</head>
<body>
<div class="top">
  <div class="brand">
    <div class="mark">YT</div>
    <div>Học Y tế<small>ĐH Quốc tế Hồng Bàng · HK1 Năm 2</small></div>
  </div>
  <div class="subjs" id="subjs"></div>
  <div class="stats">
    <div class="stat fire" title="Chuỗi ngày học"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s5 5 5 9a5 5 0 0 1-10 0c0-1 .3-2 .8-2.8C8 9.7 8 11 9 11c1.3 0 1-2.2 1-3.5C10 5 12 2 12 2z"/><path d="M12 22a6 6 0 0 1-6-6c0-2 1-3.5 2-5 0 3 2 4 4 4s4-1 4-4c1 1.5 2 3 2 5a6 6 0 0 1-6 6z" opacity=".55"/></svg><span id="streakN">0</span></div>
    <div class="stat gem" title="Tổng XP"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 3 9l9 13 9-13-9-7z"/></svg><span id="xpN">0</span></div>
    <div class="stat heart" title="Tim không giới hạn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.1-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.6C20 15.9 12 21 12 21z"/></svg><span class="inf">∞</span></div>
  </div>
</div>

<div class="wrap">
  <div class="col path shown" id="colPath"></div>
  <div class="col lesson" id="colLesson"></div>
  <div class="col practice" id="colPractice"></div>
</div>

<nav class="tabs">
  <button data-tab="Path" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10h2v9h5v-6h4v6h5v-9h2z"/></svg>Lộ trình</button>
  <button data-tab="Lesson"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v16H4zm9 0h7v16h-7z"/></svg>Bài học</button>
  <button data-tab="Practice"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 15 9l7 .6-5.3 4.6L18.3 21 12 17.3 5.7 21l1.6-6.8L2 9.6 9 9z"/></svg>Luyện tập</button>
</nav>

<script>
/* ================= NỘI DUNG 3 MÔN HỌC ================= */
const SUBJECTS = [
{ id: "htyt", name: "Hệ thống y tế Việt Nam", short: "HTYT", mid: "Hệ thống y tế", color: "blue",
  sessions: [
{
  id: "b1",
  unit: "BÀI 1",
  title: "Hệ thống y tế Việt Nam sau sắp xếp",
  subtitle: "Mô hình chính quyền địa phương 02 cấp",
  color: "blue",
  icon: "globe",
  vocab: [
    { term: "Hệ thống y tế", alt: "Health system", note: "Tổng thể các tổ chức, con người, nguồn lực, chính sách, cơ chế tài chính, công nghệ và hoạt động nhằm bảo vệ, nâng cao và chăm sóc sức khỏe nhân dân." },

  summary: [

    { heading: "7 cấu phần của hệ thống y tế", points: [

    { heading: "Bối cảnh sắp xếp – chính quyền 02 cấp", points: [

    { heading: "Chuỗi quản trị trong mô hình 02 cấp", points: [

      "Nguyên tắc quan trọng: tách bạch <b>ba lớp</b> – (1) quản lý nhà nước; (2) quản trị tổ chức/cung ứng dịch vụ; (3) chỉ đạo chuyên môn, nghiệp vụ.",

    { heading: "Tác động của sắp xếp (5 nhóm) và trường hợp TP.HCM", points: [
      "5 nhóm tác động: <b>thể chế, tổ chức, chuyên môn, tài chính, dữ liệu</b>.",

    ]}

  summary: [
    { heading: "Giám sát khác đánh giá", points: [
      "<b>Giám sát</b> (monitoring): theo dõi <b>thường xuyên</b> tiến độ – 'Đang thực hiện đến đâu? Có đúng kế hoạch không?'. Sản phẩm: dashboard, báo cáo định kỳ, cảnh báo.",
      "<b>Đánh giá</b> (evaluation): xem xét <b>có hệ thống</b> theo thời điểm – 'Có đạt mục tiêu không? Vì sao? Có nên tiếp tục/mở rộng?'. Sản phẩm: báo cáo đánh giá, khuyến nghị, bài học.",
      "Giám sát tập trung vào đầu vào, hoạt động, đầu ra; đánh giá tập trung vào kết quả, hiệu lực, hiệu quả, tác động."

    { heading: "8 nguyên tắc giám sát – đánh giá", points: [

      "<b>Khả thi</b>, <b>không gây hại</b> (bảo mật, giảm gánh nặng báo cáo), <b>phân quyền gắn trách nhiệm giải trình</b>, <b>liên tục cải tiến</b> – không chỉ để 'xếp loại'."

    { heading: "Chu trình quản lý dựa trên bằng chứng", points: [

      "Tầng kết quả: <b>đầu vào</b> (nhân lực, vaccine) → <b>hoạt động</b> (số buổi truyền thông) → <b>đầu ra</b> (số người được sàng lọc) → <b>kết quả</b> (tỷ lệ kiểm soát huyết áp) → <b>tác động</b> (giảm biến chứng, tử vong)."

    { heading: "Thiết kế chỉ số", points: [

      "Công thức: <b>bao phủ</b> = đã nhận dịch vụ / đối tượng đích × 100; <b>hoàn thành</b> = hoạt động hoàn thành / theo kế hoạch × 100; <b>phát hiện</b> = ca phát hiện / người được sàng lọc × 100; <b>kiểm soát</b> = người đạt / người được đánh giá × 100.",
      "Không so sánh địa bàn có quy mô dân số khác nhau mà <b>không chuẩn hóa</b>."
    ]},
    { heading: "Khung logic và Theory of Change", points: [

    { heading: "Các loại hình và tiêu chí đánh giá", points: [

    { heading: "Thiết kế đánh giá", points: [

      "<b>Trước–sau</b>: đơn giản nhưng khó tách tác động. <b>Có nhóm so sánh</b>: tăng khả năng quy kết. <b>Chuỗi thời gian gián đoạn</b>: cần dữ liệu định kỳ. <b>Thử nghiệm đối chứng</b>: mạnh nhân quả. <b>Định tính hỗn hợp</b>: giải thích vì sao."

    { heading: "Giám sát – đánh giá trong mô hình 02 cấp", points: [

    { heading: "Giám sát địa bàn sau sáp nhập", points: [

    { heading: "Tình huống tăng huyết áp và thông điệp cốt lõi", points: [

    { heading: "Nghiên cứu là gì?", points: [

    { heading: "Nghiên cứu khoa học và nghiên cứu sức khỏe", points: [

      "Theo <b>Luật KH&CN 2018</b>: nghiên cứu khoa học là hoạt động khám phá, phát hiện, tìm hiểu bản chất, quy luật và sáng tạo giải pháp ứng dụng. Ngày KH&CN Việt Nam: <b>18/5</b>.",
      "<b>Nghiên cứu sức khỏe</b> (nghiên cứu y học, nghiên cứu lâm sàng) nhằm hiểu sức khỏe con người, tìm cách phòng ngừa và điều trị tốt hơn.",
      "Tầm quan trọng: NCKH phát triển <b>công cụ/kiến thức mới</b> và cung cấp <b>bằng chứng khoa học</b> cho chuyên môn, quản lý y tế, quản lý nhà nước."
    ]},
    { heading: "Có phải là một nghiên cứu?", points: [
      "5 dấu hiệu: (1) <b>suy nghĩ trí tuệ</b>; (2) có <b>kế hoạch cụ thể</b> và làm theo kế hoạch; (3) <b>y đức</b>; (4) <b>có kiểm soát</b>; (5) tạo ra <b>sự thay đổi hữu ích</b>.",
      "Tức là một cách tiếp cận <b>có hệ thống</b>, dựa trên lý thuyết và hướng tới mục đích hữu ích (Tracy Ross 2012)."
    ]},
    { heading: "Phân loại nghiên cứu", points: [
      "<b>Thực nghiệm – lý thuyết</b>: thực nghiệm dựa trên quan sát, kinh nghiệm (nghiên cứu sức khỏe chủ yếu theo hướng này); lý thuyết qua tài liệu, học thuyết.",
      "<b>Cơ bản – ứng dụng</b>: cơ bản khám phá bản chất, quy luật, không có mục tiêu tiện ích cụ thể; ứng dụng hướng tới giải quyết vấn đề hiện có, tạo công nghệ mới.",
      "<b>Tam giác nghiên cứu sức khỏe</b>: <b>y sinh học</b> (cấp độ tế bào), <b>dịch vụ sức khỏe</b> (tiếp cận, chi phí, chất lượng, an toàn người bệnh), <b>hành vi ứng xử</b> (niềm tin, thái độ, thực hành)."

    { heading: "Nền tảng khoa học: 4 nguyên tắc", points: [

      "Tính trật tự: quan sát có tổ chức theo thuộc tính chung → dự đoán → nếu lặp lại sẽ trở thành <b>quy luật</b>."
    ]},
    { heading: "Suy luận: suy diễn và quy nạp", points: [
      "<b>Suy diễn</b>: từ cái chung đến cái riêng, hợp với nghiên cứu lý thuyết → kết luận dựa trên tiền đề.",
      "<b>Quy nạp</b>: từ cái riêng đến cái chung, hợp với nghiên cứu kinh nghiệm → kết luận dựa trên dữ liệu thực tế.",
      "Kết luận càng đúng khi <b>tiền đề đúng</b>; lý thuyết suy luận được phát triển thành <b>giả thuyết có thể kiểm chứng</b>."
    ]},
    { heading: "Sai số trong suy luận: tin cậy và giá trị", points: [
      "<b>Độ tin cậy</b>: tính nhất quán – đo lặp lại cho kết quả tương tự; khác nhau giữa các lần quan sát là <b>sai số ngẫu nhiên</b>.",
      "<b>Tính giá trị</b>: đo có phản ánh đúng điều cần đo; nếu không sẽ lệch về một phía – <b>sai số hệ thống</b>.",
      "Hình bia: tin cậy (−) giá trị (−); tin cậy (−) giá trị (+); tin cậy (++) giá trị (−); lý tưởng là <b>tin cậy (++) giá trị (++)</b>."
    ]},
    { heading: "Đảm bảo xác suất", points: [
      "Đo <b>độ không chắc chắn</b>, biến thiên đặc điểm giữa các cá thể; phải được bảo đảm <b>từ đầu đến cuối</b> thiết kế.",
      "Yếu tố bảo đảm và ngăn sai lệch: <b>lấy mẫu đại diện, chọn nhóm ngẫu nhiên, duy trì nhóm đối chứng, làm mù</b>, dùng phương pháp thống kê.",
      "Quan sát cả quần thể → biết hết biến thiên; quan sát cá thể (mẫu) → suy luận ra quần thể cần xác suất."
    ]},
    { heading: "Giả thuyết và phương pháp của Mill", points: [
      "<b>H0</b> – giả thuyết vô hiệu: 'không khác nhau', 'không kết hợp'. <b>H1</b> – giả thuyết thay thế/nghiên cứu: 'có khác nhau', 'có kết hợp'.",
      "Phương pháp <b>khác biệt</b>: tần suất ung thư phổi khác nhau giữa người hút và không hút thuốc. <b>Đồng thuận</b>: vệ sinh kém → nguy cơ viêm gan A cao.",
      "<b>Biến đổi đồng thời</b>: bướu cổ tăng khi iốt trong muối giảm. <b>Tương đồng</b>: phân bố bệnh A giống bệnh B (nhiễm HBV và ung thư gan)."
    ]},
    { heading: "Lập kế hoạch, quản lý và thực hiện nghiên cứu", points: [
      "Chương trình nghiên cứu: (1) vai trò, phạm vi đơn vị; (2) khả năng, nguồn lực; (3) chọn chủ đề; (4) xây dựng <b>đề cương</b>; (5) cơ cấu hành chính; (6) kế hoạch tổng hợp và <b>phổ biến kết quả</b>.",
      "Thực hiện nghiên cứu: khái quát vấn đề → bối cảnh → <b>mục tiêu</b> → phương pháp → kế hoạch hoạt động → kế hoạch phổ biến.",
      "Phẩm chất người nghiên cứu: thích khám phá; <b>kiên trì, nhẫn nại</b>; chính trực; tư duy phản biện; tiếp thu phê bình; nhận ra ý nghĩa của quan sát ngoài mong đợi."
    ]},
    { heading: "Đặc điểm phương pháp khoa học (bonus)", points: [
      "<b>Tính lặp lại</b>: người khác lặp lại độc lập và đạt kết quả tương tự. <b>Tính chính xác</b>: khái niệm phải được định nghĩa rõ để đo lường, kiểm nghiệm.",
      "<b>Tính phản nghiệm</b>: lý thuyết không thể bị bác bỏ thì không phải lý thuyết khoa học. <b>Tính tối giản</b>: chọn giải thích đơn giản, hợp lý nhất."
    ]}

    { term: "Yếu tố dự báo", alt: "Predictor", note: "Ví dụ: số mắc sốt xuất huyết trong mùa mưa cao hơn." },
    { term: "Yếu tố nguyên nhân", alt: "Causal factor", note: "Ví dụ: phơi nhiễm benzene nơi làm việc làm tăng khả năng mắc bệnh." },
    { term: "Đơn vị phân tích", alt: "Unit of analysis", note: "Trong nghiên cứu sinh thái là quần thể hoặc nhóm người chứ không phải từng cá thể." },
    { term: "Ngụy biện sinh thái", alt: "Ecological fallacy", note: "Dùng kết hợp ở cấp nhóm để suy luận cho cấp cá nhân khi kết hợp đó không tồn tại." },
    { term: "Ngụy biện sinh học", alt: "Biological fallacy", note: "Ngược lại: dùng kết quả nghiên cứu cá nhân để giải thích biến đổi giữa các nhóm dân cư." },
    { term: "Sai lệch", alt: "Bias", note: "Sai lệch có hệ thống (không phải ngẫu nhiên) của kết quả hoặc suy luận so với sự thật." },
    { term: "Sai lệch lựa chọn", alt: "Selection bias", note: "Cách chọn người tham gia làm mối liên hệ phơi nhiễm – hậu quả khác với quần thể đích." },
    { term: "Hiệu ứng người lao động khỏe mạnh", alt: "Healthy worker effect", note: "Người đang làm việc khỏe hơn dân số chung (gồm cả người thất nghiệp) – một dạng sai lệch lựa chọn." },
    { term: "Sai lệch thông tin", alt: "Information bias", note: "Thông tin được thu thập khác nhau giữa hai nhóm, dẫn đến kết luận sai về kết hợp." },
    { term: "Phân loại sai", alt: "Misclassification", note: "Khi thông tin không chính xác; có loại khác biệt và không khác biệt giữa hai nhóm." },
    { term: "Phân loại sai khác biệt", alt: "Differential", note: "Mức độ phân loại sai khác nhau giữa hai nhóm." },
    { term: "Sai số nhớ lại", alt: "Recall bias", note: "Người mắc bệnh có thể nhớ phơi nhiễm trước đây tốt hơn hoặc chi tiết hơn." },
    { term: "Người trả lời thay", alt: "Surrogate", note: "Người thân cung cấp thông tin cho ca đã chết trong khi nhóm chứng tự trả lời." },
    { term: "Nhiễu", alt: "Confounding", note: "Kết quả quan sát giữa phơi nhiễm và bệnh khác thực tế do ảnh hưởng của một biến thứ ba." },
    { term: "Biến gây nhiễu", alt: "Confounder", note: "Phải là yếu tố nguy cơ của bệnh và liên quan với phơi nhiễm, nhưng không phải là kết quả của phơi nhiễm." },
    { term: "Tỷ lệ thô / điều chỉnh", alt: "Crude / adjusted rate", note: "Tỷ lệ tử vong thô hai thành phố khác nhau nhưng sau điều chỉnh theo tuổi thì không khác." },
    { term: "Bắt cặp", alt: "Matching", note: "Kiểm soát nhiễu trong giai đoạn thiết kế và thực hiện nghiên cứu." },
    { term: "Phân tầng", alt: "Stratification", note: "Kiểm soát nhiễu trong phân tích số liệu." },
    { term: "Hiệu chỉnh", alt: "Adjustment", note: "Kiểm soát nhiễu trong phân tích số liệu." },
    { term: "Tương tác", alt: "Interaction", note: "Một vấn đề khi rút ra kết luận từ nghiên cứu phân tích, cùng với sai lệch, nhiễu và tiêu chuẩn nguyên nhân." }

  summary: [
    { heading: "Sự kết hợp giữa phơi nhiễm và hậu quả", points: [
      "Nghiên cứu phân tích tìm <b>nguyên nhân</b> của vấn đề sức khỏe; giả thuyết dự đoán mối liên quan giữa <b>phơi nhiễm và hậu quả</b>.",
      "Nếu có kết hợp, phơi nhiễm là <b>yếu tố nguy cơ</b>: có thể là <b>yếu tố dự báo</b> (SXH cao hơn mùa mưa) hoặc <b>yếu tố nguyên nhân</b> (benzene nơi làm việc).",
      "Vấn đề khi rút kết luận: <b>sai lệch và nhiễu</b>, <b>tiêu chuẩn nguyên nhân</b>, <b>tương tác</b>."
    ]},
    { heading: "Các bước nghiên cứu căn nguyên", points: [
      "Nguồn bằng chứng: <b>mô hình động vật</b>, <b>in-vitro</b>, <b>quan sát trên quần thể người</b>.",
      "Thường bắt đầu bằng <b>quan sát lâm sàng</b> → kiểm tra số liệu sẵn có để tìm kết hợp thống kê → làm nghiên cứu mới để chứng minh và suy luận nhân quả.",
      "Thứ tự: quan sát lâm sàng → số liệu sẵn có → <b>sinh thái</b> → <b>bệnh – chứng</b> → <b>thuần tập</b> → <b>thử nghiệm ngẫu nhiên</b>."
    ]},
    { heading: "Nghiên cứu sinh thái và ngụy biện", points: [
      "Đơn vị phân tích là <b>quần thể/nhóm</b>; ví dụ tử vong do ung thư tuyến tiền liệt và lycopene trong cà chua theo quốc gia; chất béo bình quân đầu người và ung thư vú.",
      "Suy luận ở cấp quần thể (văn hóa, tôn giáo, địa lý, khí hậu) chứ không phải cấp cá nhân (gen, hành vi).",
      "<b>Ngụy biện sinh thái</b>: suy từ nhóm cho cá nhân. <b>Ngụy biện sinh học</b>: suy từ cá nhân để giải thích biến đổi giữa các nhóm."
    ]},
    { heading: "'Đó là sự thật?' – cơ hội hay sai lệch?", points: [
      "Khi quan sát được một kết hợp, câu hỏi đầu tiên luôn là <b>'Đó là sự thật?'</b>.",
      "Do <b>cơ hội</b>? (quần thể không đại diện, cỡ mẫu không thích hợp). Do <b>sai lệch</b>? (lỗi hệ thống trong thiết kế, thực hiện, phân tích – Schlesselman & Stolley 1982).",
      "<b>Sai lệch</b>: khác biệt <b>có hệ thống</b> (không phải ngẫu nhiên) so với sự thật. Ba nhóm: <b>sai lệch lựa chọn, sai lệch thông tin, nhiễu</b>."
    ]},
    { heading: "Sai lệch lựa chọn – ví dụ", points: [
      "Chọn người tham gia làm méo mối liên hệ so với quần thể đích; việc chọn ở nhóm này cho kết quả khác nhóm kia.",
      "<b>Bệnh viện</b>: người nghiện rượu bị viêm phổi dễ nhập viện hơn → nguy cơ bị <b>đẩy lên</b> (OR = 2,25 thay vì 1,00).",
      "<b>Người tình nguyện</b> trong sàng lọc: có thể quan tâm sức khỏe hơn (ít bệnh) hoặc nguy cơ cao hơn (tiền sử gia đình).",
      "<b>Hiệu ứng người lao động khỏe mạnh</b>: so người lao động với dân số chung có cả người thất nghiệp."
    ]},
    { heading: "Hạn chế sai lệch lựa chọn", points: [
      "<b>Bệnh – chứng</b>: tiêu chí chọn bệnh và chứng <b>độc lập với phơi nhiễm</b>.",
      "<b>Thuần tập</b>: tiêu chí chọn nhóm phơi nhiễm và không phơi nhiễm <b>độc lập với kết quả bệnh</b>.",
      "Dùng <b>thử nghiệm lâm sàng ngẫu nhiên</b>."
    ]},
    { heading: "Sai lệch thông tin", points: [
      "Thông tin thu thập <b>khác nhau giữa hai nhóm</b>; thông tin sai gây <b>phân loại sai</b>: <b>khác biệt</b> (mức sai khác nhau giữa hai nhóm) hoặc <b>không khác biệt</b>.",
      "Nguồn: người phỏng vấn <b>biết tình trạng</b> nên thăm dò khác; <b>sai số nhớ lại</b> (người bệnh nhớ tốt hơn); <b>người trả lời thay</b> cho ca đã chết.",
      "Hạn chế: <b>quy trình chuẩn</b>; nguồn và phương pháp thu thập giống nhau cho mọi nhóm; người phỏng vấn <b>không biết</b> tình trạng phơi nhiễm/bệnh; có chiến lược đánh giá sai lệch."
    ]},
    { heading: "Nhiễu (confounding)", points: [
      "Kết quả khác sự thật do <b>biến thứ ba</b>. Ví dụ: tỷ lệ tử vong thô hai thành phố khác nhau nhưng sau <b>điều chỉnh theo tuổi</b> thì không khác → tuổi gây nhiễu.",
      "Ví dụ cà phê và ung thư tụy: <b>hút thuốc</b> là biến nhiễu vì là yếu tố nguy cơ ung thư tụy và đi kèm uống cà phê nhưng không phải kết quả của uống cà phê.",
      "Điều kiện biến nhiễu: (1) là <b>yếu tố nguy cơ của bệnh</b>; (2) <b>liên quan với phơi nhiễm</b> nhưng <b>không phải kết quả</b> của phơi nhiễm."
    ]},
    { heading: "Kiểm soát nhiễu và kết luận", points: [
      "Thiết kế: <b>bắt cặp</b>. Phân tích: <b>phân tầng</b>, <b>hiệu chỉnh</b>.",
      "<b>Sai lệch</b> là lỗi hệ thống và <b>không thể điều chỉnh</b>; <b>nhiễu</b> làm sai kết luận nhưng khi biết biến nhiễu thì <b>có thể điều chỉnh</b>.",
      "Để kết luận có kết hợp: <b>đủ cỡ mẫu</b>, <b>không có sai lệch</b>, <b>đã điều chỉnh nhiễu</b> – sau đó mới xét phơi nhiễm có phải nguyên nhân không."
    ]}
  ],

    { term: "Đánh giá tác động môi trường", alt: "EIA", note: "Dự báo, nhận diện, đánh giá, quản lý tác động tiềm tàng của dự án trước khi triển khai." },
    { term: "Hiệu ứng nhà kính", alt: "Greenhouse effect", note: "Một số khí (CO₂, CH₄, hơi nước) hấp thụ và giữ nhiệt, duy trì nhiệt độ gần bề mặt Trái Đất." },
    { term: "Tính bền vững", alt: "Sustainability", note: "Sử dụng tài nguyên hiện có mà không đe dọa khả năng đáp ứng nhu cầu của thế hệ tương lai; tập trung vào khía cạnh sinh thái." },
    { term: "Dấu chân sinh thái", alt: "Ecological footprint", note: "Chỉ số đo tác động của con người lên môi trường, đơn vị gha/người (2,6 gha/người năm 2026)." },

    { term: "Ngày Trái Đất vượt ngưỡng", alt: "Earth Overshoot Day", note: "Thời điểm nhân loại dùng hết tài nguyên Trái Đất tái tạo được trong năm; năm 2026 là ngày 30/7." },
    { term: "Tín chỉ carbon", alt: "Carbon credit", note: "Chứng nhận quyền phát thải; 1 tín chỉ ≈ 1 tấn CO₂ hoặc khí nhà kính quy đổi tương đương." },
    { term: "Sức khỏe (WHO 1948)", alt: "Health", note: "Trạng thái thoải mái toàn diện về thể chất, tinh thần và xã hội, không chỉ là không có bệnh hay thương tật." },

    { term: "Phơi nhiễm", alt: "Exposure", note: "Mức độ = nồng độ × thời gian × tần suất tiếp xúc; qua hô hấp, tiêu hóa, da – niêm mạc, nhau thai và sữa mẹ." },

    { term: "Tác động hiệp đồng", alt: "Synergy", note: "Hai tác nhân phối hợp gây hại lớn hơn tổng riêng lẻ, ví dụ amiăng + thuốc lá, radon + thuốc lá." },
    { term: "Nhóm dễ bị tổn thương", alt: "Vulnerable groups", note: "Thai nhi, trẻ em, phụ nữ có thai, người cao tuổi, người bệnh mạn tính, người nghèo, người lao động tiếp xúc nghề nghiệp." },

    { term: "Một sức khỏe", alt: "One Health", note: "Tiếp cận coi sức khỏe con người – động vật – hệ sinh thái gắn bó với nhau." }

  summary: [
    { heading: "Môi trường: khái niệm, thành phần, chức năng", points: [

      "Thành phần: <b>hữu sinh</b> (sinh vật sản xuất, tiêu thụ, phân giải) và <b>vô sinh</b> (không khí, nước, nhiệt độ, độ ẩm…).",
      "Chức năng: cung cấp tài nguyên (tái tạo, không tái tạo, vĩnh cửu), điều hòa khí hậu, duy trì sự sống, bảo tồn đa dạng sinh học, xử lý chất thải, nâng chất lượng cuộc sống."

    { heading: "Ô nhiễm môi trường và phân loại", points: [

      "Theo nguồn: <b>nguồn điểm, nguồn đường, nguồn phân tán</b>. Theo môi trường: nước, đất, không khí. Theo tác nhân: hóa học, phóng xạ, nhiệt, tiếng ồn, điện từ, ánh sáng, thị giác.",
      "Ô nhiễm nước do nhà máy, khu dân cư xả thải chưa xử lý, nông nghiệp; ô nhiễm không khí do đốt nhiên liệu hóa thạch, giao thông; ô nhiễm đất do xả thải, hóa chất nông nghiệp."
    ]},
    { heading: "Phân hủy và tác động của ô nhiễm", points: [
      "<b>Phân hủy sinh học</b>: vi sinh vật phân giải thành CO₂, H₂O, sinh khối (giấy, gỗ). Nhựa PE, PP, PS, PVC, PET khó phân hủy, chỉ <b>phân rã</b> thành vi nhựa/nano nhựa.",
      "Tác động: tuyệt chủng, suy giảm đa dạng sinh học, bệnh tật, mưa axit, trầm trọng thêm biến đổi khí hậu.",
      "Loại tác động: trực tiếp/gián tiếp, tạm thời/lâu dài, phục hồi/không phục hồi, tích lũy/hiệp đồng, hiện tại/tiềm tàng, cục bộ/diện rộng.",
      "<b>EIA</b>: đánh giá trước khi triển khai dự án; rủi ro quá cao thì dự án có thể không được phê duyệt."
    ]},
    { heading: "Hiệu ứng nhà kính và thỏa thuận quốc tế", points: [
      "Khí nhà kính: chủ yếu là <b>hơi nước</b>; <b>CO₂</b> quan trọng thứ hai (~0,035%), ~50% CO₂ phát thải tồn tại nhiều thập kỷ; ngoài ra CH₄, N₂O, HFCs, PFCs, SF₆, NF₃.",
      "Hậu quả: biến đổi khí hậu, thay đổi chế độ mưa, tăng nhiệt độ đại dương, suy giảm sức khỏe.",
      "<b>UNFCCC 1992</b> (VN tham gia 1994); <b>Kyoto 1997</b> (VN 2005); <b>Paris 2015</b> (<2°C, nỗ lực 1,5°C; VN 2016). Ngày Môi trường Thế giới: <b>5/6</b> (từ Hội nghị Stockholm 1972)."

    { heading: "Bền vững, dấu chân sinh thái, tín chỉ carbon", points: [

    { heading: "Sức khỏe và yếu tố quyết định", points: [

      "<b>Dahlgren & Whitehead (1991)</b>: các lớp từ cá nhân → lối sống → mạng lưới xã hội → điều kiện sống, làm việc → kinh tế – xã hội chung. Phần lớn yếu tố nằm ngoài ngành y tế → cần <b>phối hợp liên ngành</b>."

    { heading: "Gánh nặng bệnh tật do môi trường", points: [

      "<b>Ô nhiễm không khí</b> là nguy cơ hàng đầu (7,9 triệu ca năm 2023); thiếu nước sạch – vệ sinh ~1,4 triệu (2019); chì ~1,5 triệu (2021).",

    { heading: "Yếu tố môi trường và phơi nhiễm", points: [

      "Chuỗi: nguồn phát thải → phát tán → môi trường trung gian → tiếp xúc → hấp thu. Đường: <b>hô hấp, tiêu hóa, da – niêm mạc, nhau thai và sữa mẹ</b>.",
      "<b>Mức phơi nhiễm = nồng độ × thời gian × tần suất</b>. Trong cơ thể: hấp thu → phân bố → chuyển hóa → tích lũy/thải trừ; có tích lũy và <b>khuếch đại sinh học</b>."

    { heading: "Liều – đáp ứng và nhóm dễ tổn thương", points: [

    { heading: "Nguy cơ truyền thống – hiện đại và mô hình đánh giá", points: [

    { heading: "Biến đổi khí hậu và sức khỏe", points: [

/* ================= state ================= */
const DEFAULT = { done:{}, xp:0, streak:0, last:null, best:{}, subj:'htyt', cur:{} };
let S = JSON.parse(JSON.stringify(DEFAULT));
let cur = COURSE[0].id;
const K = sid => SUBJ.id + '/' + sid;
let quiz = null;

const KEY = 'hbu-yte-3mon-progress-v1';
async function load(){
  let raw = null;
  try{ if(window.storage){ const r = await window.storage.get(KEY); if(r&&r.value) raw = r.value; } }catch(e){}
  if(!raw){ try{ raw = localStorage.getItem(KEY); }catch(e){} }
  try{ if(raw) S = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), JSON.parse(raw)); }catch(e){}
  const sj = SUBJECTS.find(x=>x.id===S.subj) || SUBJECTS[0];
  setSubject(sj.id, true);
  bumpStreak();
}
async function save(){
  const v = JSON.stringify(S);
  try{ if(window.storage) await window.storage.set(KEY, v); }catch(e){}
  try{ localStorage.setItem(KEY, v); }catch(e){}
}
function setSubject(id, silent){
  SUBJ = SUBJECTS.find(x=>x.id===id) || SUBJECTS[0];
  COURSE = SUBJ.sessions;
  const remembered = S.cur && S.cur[SUBJ.id];
  cur = (remembered && COURSE.some(s=>s.id===remembered)) ? remembered : COURSE[0].id;
  S.subj = SUBJ.id;
  if(!silent) save();
}
function drawSubjects(){
  document.getElementById('subjs').innerHTML = SUBJECTS.map(x=>{
    const tot = x.sessions.length*3;
    const dn = x.sessions.reduce((a,s)=>a+['vocab','summary','quiz'].filter(p=>S.done[x.id+'/'+s.id]&&S.done[x.id+'/'+s.id][p]).length,0);
    return `<button class="subj ${x.id===SUBJ.id?'on':''}" data-subj="${x.id}">
      <span class="sb-dot" style="background:var(--${x.color})">${x.short.slice(0,2)}</span>
      <span class="full">${x.name}</span><span class="short">${x.short}</span>
      <small>${dn}/${tot}</small></button>`;
  }).join('');
  document.querySelectorAll('[data-subj]').forEach(b=>b.onclick=()=>{
    if(b.dataset.subj===SUBJ.id) return;
    setSubject(b.dataset.subj); startQuiz(); drawAll(); show('Path');
    document.getElementById('colPath').scrollTop=0;
  });
}

function today(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const t = today();
  if(S.last === t) return;
  const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak = (S.last === y) ? S.streak+1 : 1;
  S.last = t; save();
}
function isDone(sid,part){ const k=K(sid); return !!(S.done[k] && S.done[k][part]); }
function markDone(sid,part,xp){
  if(isDone(sid,part)) return false;
  const k=K(sid);
  S.done[k] = S.done[k] || {};
  S.done[k][part] = true;
  S.xp += xp; save(); return true;
}
function sessDone(sid){ return ['vocab','summary','quiz'].filter(p=>isDone(sid,p)).length; }
const sess = id => COURSE.find(s=>s.id===id);

/* ================= render: path ================= */
function drawPath(){
  const zig = ['c','r','l'];
  const head = `<div class="pathhead"><div class="sb-dot" style="background:var(--${SUBJ.color})">${SUBJ.short}</div><div><b>${SUBJ.name}</b><span>${COURSE.length} bài · nhấn vào bong bóng để học</span></div></div>`;
  document.getElementById('colPath').innerHTML = head + COURSE.map(s=>{
    const n = sessDone(s.id);
    return `<div class="unit ${s.color}">
        <div><b>${s.unit}</b><span>${s.title}</span></div>
        <div style="font-size:12px;opacity:.9">${n}/3</div>
      </div>
      <div class="nodes">${['vocab','summary','quiz'].map((p,i)=>{
        const done = isDone(s.id,p);
        const active = s.id===cur;
        const first = s.id===COURSE[0].id && i===0 && !done;
        return `<div class="noderow ${zig[i]}">
          <button class="node ${done?'done':'on'} ${active?'active':''}" data-s="${s.id}" data-p="${p}">
            ${first?'<span class="startpill">BẮT ĐẦU</span>':''}
            <span class="bubble">${ICON[NODE_ICON[p]]}</span>
            ${done?'<span class="crown">★</span>':''}
            <small>${NODE_NAME[p]}</small>
          </button></div>`;
      }).join('')}</div>`;
  }).join('');
  document.querySelectorAll('.node').forEach(b=>b.onclick=()=>{
    const s=b.dataset.s, p=b.dataset.p;
    const switched = s!==cur;
    if(switched){ cur=s; S.cur[SUBJ.id]=s; save(); startQuiz(); }

    if(p==='quiz'){
      startQuiz();                 // always open this session's 9 questions at Q1
      drawQuiz(); drawPath();
      if(switched) drawLesson();
      show('Practice');
      const pane=document.getElementById('colPractice');
      pane.scrollTop=0;
      if(window.innerWidth>820) pane.scrollIntoView({behavior:'smooth',block:'nearest'});
      flash(pane);
    }else{
      if(switched){ drawLesson(); drawQuiz(); drawPath(); }
      show('Lesson');
      const el=document.getElementById('sec-'+p);
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    }
  });
}

function flash(el){
  el.animate(
    [{background:'#fff'},{background:'var(--blue-l)'},{background:'#fff'}],
    {duration:520, easing:'ease-out'}
  );
}

  document.getElementById('goPractice').onclick=()=>openMode('quiz');

/* ================= quiz ================= */
let pmode = 'quiz', fc = null, smc = null;
function startQuiz(){
  quiz = { i:0, correct:0, checked:false, sel:null, placed:[], xp:0 };
  pmode = 'quiz'; fc = null; smc = null;
}
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const strip = h => String(h).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();

function drawQuiz(){
  const box = document.getElementById('colPractice');
  const modes = [['quiz','✦ Bài tập'],['flash','🃏 Flashcard'],['smc','📝 Trắc nghiệm']];
  box.innerHTML = `<div class="pmodes">${modes.map(([m,l])=>`<button data-pm="${m}" class="${pmode===m?'on':''}">${l}</button>`).join('')}</div><div id="pbody"></div>`;
  box.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{ pmode=b.dataset.pm; drawQuiz(); box.scrollTop=0; });
  if(pmode==='flash') return drawFlash();
  if(pmode==='smc') return drawSmc();
  drawExercise();
}

/* ---------- flashcards ---------- */
function buildDeck(s, deck){
  if(deck==='vocab') return s.vocab.map((v,i)=>({id:'v'+i, kind:'TỪ VỰNG', front:`<div class="term">${v.term}</div>${v.alt?`<div class="alt">${v.alt}</div>`:''}`, back:`<div class="bk-h">${v.term}</div><div class="bk-t">${v.note}</div>`}));
  return s.summary.map((sec,i)=>({id:'l'+i, kind:'BÀI HỌC · '+(i+1)+'/'+s.summary.length, front:`<div class="term" style="font-size:21px">${sec.heading}</div><div class="alt">Nhớ lại các ý chính rồi lật thẻ</div>`, back:`<div class="bk-h">${sec.heading}</div><ul>${sec.points.map(p=>`<li>${p}</li>`).join('')}</ul>`}));
}
function startFlash(deck){
  const s = sess(cur), cards = buildDeck(s, deck);
  fc = { sid:s.id, deck, cards, queue: cards.map((_,i)=>i), known:0, again:0, flipped:false, xp:0 };
}
function drawFlash(){
  const s = sess(cur), body = document.getElementById('pbody');
  if(!fc || fc.sid!==s.id) startFlash(fc ? fc.deck : 'vocab');
  const tabs = `<div class="deckpick"><button data-deck="vocab" class="${fc.deck==='vocab'?'on':''}">Từ vựng · ${s.vocab.length}</button><button data-deck="lesson" class="${fc.deck==='lesson'?'on':''}">Bài học · ${s.summary.length}</button></div>`;
  const total = fc.cards.length;
  if(!fc.queue.length){
    const key = fc.deck==='vocab' ? 'fc_vocab' : 'fc_lesson';
    const gained = markDone(s.id, key, 10) ? 10 : 0;
    body.innerHTML = tabs + `<div class="finish">
      <div style="font-size:46px">🎉</div>
      <div class="big">Đã thuộc hết ${total} thẻ!</div>
      <p>${s.title} · ${fc.deck==='vocab'?'Từ vựng':'Bài học'}${fc.again?` · ôn lại ${fc.again} lần`:''}</p>
      <div class="scorebox"><div class="sb"><div class="h">XP</div><div class="v">+${gained}</div></div>
      <div class="sb b"><div class="h">SỐ THẺ</div><div class="v">${total}</div></div></div>
      <button class="btn wide" id="fcAgain">HỌC LẠI BỘ THẺ</button>
      <button class="btn ghost wide" id="fcOther" style="margin-top:10px">CHUYỂN SANG ${fc.deck==='vocab'?'THẺ BÀI HỌC':'THẺ TỪ VỰNG'}</button></div>`;
    bindDeck();
    document.getElementById('fcAgain').onclick=()=>{ startFlash(fc.deck); fc.queue=shuffle(fc.queue); drawFlash(); };
    document.getElementById('fcOther').onclick=()=>{ startFlash(fc.deck==='vocab'?'lesson':'vocab'); drawFlash(); };
    drawSubjects(); drawStats();
    return;
  }
  const c = fc.cards[fc.queue[0]];
  body.innerHTML = tabs + `
    <div class="pbar" style="margin-bottom:12px"><div class="track"><div class="fill" style="width:${fc.known/total*100}%"></div></div></div>
    <div class="fcmeta"><span>${s.unit} · ĐÃ THUỘC ${fc.known}/${total}</span><span>CÒN ${fc.queue.length} THẺ</span></div>
    <div class="fcwrap"><div class="fcard ${fc.flipped?'flip':''}" id="fcard">
      <div class="fface front"><span class="kind">${c.kind}</span>${c.front}<div class="tap">👆 Chạm để lật thẻ</div></div>
      <div class="fface back"><span class="kind">${c.kind} · MẶT SAU</span>${c.back}</div>
    </div></div>
    <div class="fcbtns">
      <button class="btn red" id="fcNo">CHƯA THUỘC</button>
      <button class="btn" id="fcYes">ĐÃ THUỘC</button>
    </div>
    <div class="fctools"><button id="fcShuf">🔀 TRỘN THẺ</button><button id="fcReset">↺ LÀM LẠI</button></div>`;
  bindDeck();
  const card = document.getElementById('fcard');
  card.onclick = ()=>{ fc.flipped=!fc.flipped; card.classList.toggle('flip', fc.flipped); };
  document.getElementById('fcYes').onclick=()=>{ fc.queue.shift(); fc.known++; fc.flipped=false; drawFlash(); };
  document.getElementById('fcNo').onclick=()=>{ const x=fc.queue.shift(); const at=Math.min(fc.queue.length, 3); fc.queue.splice(at,0,x); fc.again++; fc.flipped=false; drawFlash(); };
  document.getElementById('fcShuf').onclick=()=>{ fc.queue=shuffle(fc.queue); fc.flipped=false; drawFlash(); };
  document.getElementById('fcReset').onclick=()=>{ startFlash(fc.deck); drawFlash(); };
}
function bindDeck(){
  document.querySelectorAll('[data-deck]').forEach(b=>b.onclick=()=>{ if(b.dataset.deck!==fc.deck){ startFlash(b.dataset.deck); drawFlash(); } });
}

/* ---------- multiple choice built from the summary ---------- */
function genSmc(s){
  const items = [];               // every bold phrase with its point and section
  s.summary.forEach((sec,si)=>sec.points.forEach(p=>{
    const re=/<b>(.*?)<\/b>/g; let m;
    while((m=re.exec(p))){ const t=strip(m[1]); if(t.length>=2 && t.length<=70) items.push({si, p, raw:m[0], t}); }
  }));
  const pool = [...new Map(items.map(x=>[norm(x.t),x.t])).values()];
  const qs = [];
  // fill-the-gap questions: hide one bold phrase of a summary point
  for(const it of shuffle(items)){
    if(qs.length>=7) break;
    if(qs.some(q=>q.p===it.p)) continue;
    if(it.p.split(it.raw).length!==2) continue;
    const others = shuffle(pool.filter(t=>norm(t)!==norm(it.t))).slice(0,3);
    if(others.length<3) continue;
    const opts = shuffle([it.t, ...others]);
    const stem = strip(it.p.replace(it.raw,'§§')).replace('§§','<span class="gap">_____</span>');
    qs.push({kind:'Điền vào chỗ trống', q:stem, opts, ans:opts.indexOf(it.t), src:it.p, sec:s.summary[it.si].heading, p:it.p});
  }
  // which-section questions
  const heads = s.summary.map(x=>x.heading);
  const pts = shuffle(s.summary.flatMap((sec,si)=>sec.points.map(p=>({si,p})))).filter(x=>!qs.some(q=>q.p===x.p));
  for(const x of pts){
    if(qs.length>=10 || heads.length<4) break;
    const right = heads[x.si];
    const opts = shuffle([right, ...shuffle(heads.filter((_,i)=>i!==x.si)).slice(0,3)]);
    let txt = strip(x.p); if(txt.length>230) txt = txt.slice(0,227)+'…';
    qs.push({kind:'Ý này thuộc phần nào?', q:`<span style="font-weight:700">“${txt}”</span>`, opts, ans:opts.indexOf(right), src:x.p, sec:right, p:x.p});
  }
  return shuffle(qs);
}
function drawSmc(){
  const s = sess(cur), body = document.getElementById('pbody');
  if(!smc || smc.sid!==s.id) smc = { sid:s.id, qs:genSmc(s), i:0, correct:0, sel:null, checked:false, xp:0 };
  const Q = smc.qs;
  if(smc.i >= Q.length){
    const gained = markDone(s.id,'smc', smc.xp) ? smc.xp : 0;
    body.innerHTML = `<div class="finish">
      <div style="font-size:46px">${smc.correct>=Q.length*0.7?'🏆':'💪'}</div>
      <div class="big">${smc.correct>=Q.length*0.7?'Nắm bài rất chắc!':'Ôn lại tóm tắt nhé!'}</div>
      <p>${s.title} · đúng ${smc.correct}/${Q.length} câu</p>
      <div class="scorebox"><div class="sb"><div class="h">XP</div><div class="v">+${gained}</div></div>
      <div class="sb b"><div class="h">ĐỘ CHÍNH XÁC</div><div class="v">${Math.round(smc.correct/Q.length*100)}%</div></div></div>
      <button class="btn wide" id="smcAgain">LÀM BỘ CÂU HỎI MỚI</button>
      <button class="btn ghost wide" id="smcRead" style="margin-top:10px">XEM LẠI TÓM TẮT</button></div>`;
    document.getElementById('smcAgain').onclick=()=>{ smc=null; drawSmc(); };
    document.getElementById('smcRead').onclick=()=>{ show('Lesson'); const el=document.getElementById('sec-summary'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); };
    drawSubjects(); drawPath(); drawStats();
    return;
  }
  const q = Q[smc.i];
  body.innerHTML = `
    <div class="pbar"><div class="track"><div class="fill" style="width:${smc.i/Q.length*100}%"></div></div></div>
    <div class="qtag"><span class="dot">✦</span>${s.unit} · ${q.kind.toUpperCase()} · ${smc.i+1}/${Q.length}</div>
    <h3 class="qtitle" style="font-size:18px">${q.q}</h3>
    ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${o}</button>`).join('')}
    <div class="feedback" id="fb"></div>
    <div class="pfoot"><button class="btn wide" id="check" disabled>KIỂM TRA</button></div>`;
  const check = document.getElementById('check');
  body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(smc.checked) return;
    body.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); smc.sel=+b.dataset.i; check.disabled=false;
  });
  check.onclick=()=>{
    const ok = smc.sel===q.ans;
    body.querySelectorAll('.opt').forEach((b,i)=>{ b.classList.remove('sel'); if(i===q.ans) b.classList.add('right'); else if(i===smc.sel) b.classList.add('wrong'); });
    smc.checked=true; if(ok){ smc.correct++; smc.xp+=5; }
    const fb=document.getElementById('fb');
    fb.className='feedback show '+(ok?'ok':'no');
    fb.innerHTML = `<h4>${ok?'✓ Chính xác!':'✕ Chưa đúng'}</h4><p>${ok?'':`Đáp án đúng: <u>${q.opts[q.ans]}</u><br>`}Phần: ${q.sec}</p><div class="smc-src">${q.src}</div>`;
    check.textContent='TIẾP TỤC';
    if(!ok) check.style.background='var(--red)', check.style.boxShadow='0 4px 0 var(--red-d)';
    check.onclick=()=>{ smc.i++; smc.checked=false; smc.sel=null; drawSmc(); };
  };
}
const norm = t => String(t).normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N} ]/gu,' ').replace(/\s+/g,' ').trim();
const flat = t => norm(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');

function drawExercise(){
  const s = sess(cur), Q = s.questions, box = document.getElementById('pbody');

  if(quiz.i >= Q.length){
    const gained = markDone(s.id,'quiz', quiz.xp) ? quiz.xp : 0;
    const prevBest = S.best[K(s.id)]||0;
    if(quiz.correct > prevBest){ S.best[K(s.id)]=quiz.correct; save(); }
    box.innerHTML = `<div class="finish">
      <div style="font-size:46px">${quiz.correct>=7?'🏆':'💪'}</div>
      <div class="big">${quiz.correct>=7?'Hoàn thành bài học!':'Cố gắng tốt lắm!'}</div>
      <p>${s.title} · đúng ${quiz.correct}/${Q.length} câu</p>
      <div class="scorebox">
        <div class="sb"><div class="h">TỔNG XP</div><div class="v">+${quiz.xp}</div></div>
        <div class="sb b"><div class="h">ĐỘ CHÍNH XÁC</div><div class="v">${Math.round(quiz.correct/Q.length*100)}%</div></div>
      </div>
      <button class="btn wide" id="again">LUYỆN LẠI</button>
      <button class="btn ghost wide" id="next" style="margin-top:10px">BÀI TIẾP THEO</button>
    </div>`;
    document.getElementById('again').onclick=()=>{ startQuiz(); drawAll(); };
    document.getElementById('next').onclick=()=>{
      const i = COURSE.findIndex(x=>x.id===cur);
      cur = COURSE[(i+1)%COURSE.length].id; S.cur[SUBJ.id]=cur; save(); startQuiz(); drawAll(); show('Lesson');
    };
    drawSubjects(); drawPath(); drawStats(); drawLesson();
    return;
  }

  const q = Q[quiz.i];
  const label = {mc:'TRẮC NGHIỆM', fill:'ĐIỀN VÀO CHỖ TRỐNG', drag:'SẮP XẾP CÂU'}[q.type];
  let body = '';

  if(q.type==='mc'){
    body = `<h3 class="qtitle">${q.q}</h3>` + q.options.map((o,i)=>
      `<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${o}</button>`).join('');
  }
  if(q.type==='fill'){
    const parts = q.sentence.split('___');
    body = `<h3 class="qtitle">Hoàn thành câu sau</h3>
      <div class="sent">${parts[0]}<input id="blank" autocomplete="off" spellcheck="false">${parts[1]||''}</div>`;
  }
  if(q.type==='drag'){
    const words = q.words;
    body = `<h3 class="qtitle">${q.prompt}</h3>
      <div class="answer-line" id="line">${quiz.placed.map(w=>
        `<button class="tile" data-rm="${w.i}">${w.t}</button>`).join('')}</div>
      <div class="answer-line second"></div>
      <div class="bank">${words.map((w,i)=>
        `<button class="tile ${quiz.placed.some(p=>p.i===i)?'ghosted':''}" data-add="${i}">${w}</button>`).join('')}</div>`;
  }

  box.innerHTML = `
    <div class="pbar">
      <button class="px" id="quit">✕</button>
      <div class="track"><div class="fill" style="width:${quiz.i/Q.length*100}%"></div></div>
      <div class="stat heart" style="font-size:14px"><svg viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px"><path d="M12 21s-8-5.1-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.6C20 15.9 12 21 12 21z"/></svg><span class="inf">∞</span></div>
    </div>
    <div class="qtag"><span class="dot">✦</span>${s.unit} · ${label} · ${quiz.i+1}/${Q.length}</div>
    ${body}
    <p class="hintbar">Gợi ý: <b>${q.hint}</b></p>
    <div class="feedback" id="fb"></div>
    <div class="pfoot"><button class="btn wide" id="check" disabled>KIỂM TRA</button></div>`;

  document.getElementById('quit').onclick=()=>{ startQuiz(); drawAll(); show('Lesson'); };
  const check = document.getElementById('check');

  if(q.type==='mc'){
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(quiz.checked) return;
      document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); quiz.sel = +b.dataset.i; check.disabled=false;
    });
    if(quiz.sel!=null){ const el=document.querySelector(`.opt[data-i="${quiz.sel}"]`); if(el)el.classList.add('sel'); check.disabled=false; }
  }
  if(q.type==='fill'){
    const inp = document.getElementById('blank');
    inp.oninput = ()=>{ check.disabled = !inp.value.trim(); };
    inp.onkeydown = e=>{ if(e.key==='Enter' && !check.disabled) check.click(); };
    setTimeout(()=>inp.focus(),40);
  }
  if(q.type==='drag'){
    document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
      if(quiz.checked) return;
      quiz.placed.push({i:+b.dataset.add, t:b.textContent}); drawQuiz();
    });
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
      if(quiz.checked) return;
      quiz.placed = quiz.placed.filter(p=>p.i !== +b.dataset.rm); drawQuiz();
    });
    check.disabled = quiz.placed.length===0;
  }

  check.onclick = ()=>{
    let ok=false, right='';
    if(q.type==='mc'){ ok = quiz.sel===q.answer; right=q.options[q.answer];
      document.querySelectorAll('.opt').forEach((b,i)=>{
        b.classList.remove('sel');
        if(i===q.answer) b.classList.add('right');
        else if(i===quiz.sel) b.classList.add('wrong');
      });
    }
    if(q.type==='fill'){ const v=norm(document.getElementById('blank').value);
      ok = (q.accept||[q.answer]).some(a=>norm(a)===v || flat(a)===flat(v)); right=q.answer;
      document.getElementById('blank').style.color = ok?'var(--green-t)':'var(--red-t)';
      document.getElementById('blank').disabled = true;
    }
    if(q.type==='drag'){ ok = norm(quiz.placed.map(p=>p.t).join(' '))===norm(q.answer);
      document.querySelectorAll('[data-rm]').forEach(t=>t.style.borderColor = ok?'var(--green)':'var(--red)'); right=q.answer; }

    quiz.checked=true;
    if(ok){ quiz.correct++; quiz.xp+=10; }
    const fb=document.getElementById('fb');
    fb.className='feedback show '+(ok?'ok':'no');
    fb.innerHTML = ok
      ? `<h4>✓ Chính xác!</h4><p>${q.hint}</p>`
      : `<h4>✕ Chưa đúng</h4><p>Đáp án đúng: <span style="text-decoration:underline">${right}</span><br>${q.hint}</p>`;
    check.textContent='TIẾP TỤC';
    if(!ok) check.style.background='var(--red)', check.style.boxShadow='0 4px 0 var(--red-d)';
    check.onclick = ()=>{ quiz.i++; quiz.checked=false; quiz.sel=null; quiz.placed=[]; drawQuiz(); drawStats(); };
  };
}

/* ================= misc ================= */
function drawStats(){
  document.getElementById('xpN').textContent = S.xp;
  document.getElementById('streakN').textContent = S.streak;
}
function drawAll(){ drawSubjects(); drawPath(); drawLesson(); drawQuiz(); drawStats(); }

function show(tab){
  if(window.innerWidth>820) return;
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('shown'));
  document.getElementById('col'+tab).classList.add('shown');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  window.scrollTo(0,0);
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));

(async()=>{ await load(); startQuiz(); drawAll(); })();
</script>
